# Development stack. Copy to the repository root as docker-compose-dev.yml (ignored by git)
# and use it only through scripts/local.sh. scripts/verify.sh uses this tracked file directly.
# Relative paths resolve against the repository root (the scripts pass --project-directory).
# Images are built by the scripts; nothing is built here.

services:
  mikud:
    image: mikud:${MIKUD_IMAGE_TAG:-dev}
    env_file: docker/dev.env
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only. scripts/verify.sh sets MIKUD_PORT=0 for a free port.
    ports:
      - "127.0.0.1:${MIKUD_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:18.6-bookworm
    env_file: docker/dev.env
    volumes:
      # PostgreSQL 18 keeps its data in a versioned directory under /var/lib/postgresql.
      - ${MIKUD_DATA_DIR:?MIKUD_DATA_DIR is set by the scripts}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
